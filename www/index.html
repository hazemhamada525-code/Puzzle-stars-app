<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<title>نجوم البازل - مغامرة الصور</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="homeScreen" class="screen">
  <div class="top-bar"><span class="points-display" id="homePoints">💎 0</span><button class="action-btn" onclick="toggleTheme()">🌓</button></div>
  <div class="game-title">نجوم البازل</div>
  <div class="grid-container" id="mainGrid"></div>
  <div class="action-buttons">
    <button class="action-btn" onclick="openAchievements()">🏆 الإنجازات</button>
    <button class="action-btn" onclick="openCumulativeBonus()">💰 البونص التراكمي</button>
    <button class="action-btn" onclick="openChallenges()">⚔️ التحديات</button>
    <button class="action-btn" onclick="openStore()">🛒 المتجر</button>
  </div>
  <div class="pager"><button class="action-btn" onclick="changePage(-1)">▶ السابق</button><span id="pageIndicator">صفحة 1</span><button class="action-btn" onclick="changePage(1)">التالي ◀</button></div>
</div>

<div id="gameScreen" class="screen hidden">
  <div class="stats"><button class="action-btn" onclick="exitGame()">↩ خروج</button><div><span class="timer" id="gameTimer">⏱ 45</span><span class="moves" id="gameMoves">حركات: 0</span></div><div id="gameStars">⭐⭐⭐</div></div>
  <div id="puzzleContainer" class="puzzle-board"></div>
  <div class="game-tools"><button class="action-btn" onclick="useShuffle()">🔀 خلط</button><button class="action-btn" onclick="useMagnet()">🧲 مغناطيس</button><button class="action-btn" id="freezeBtn" onclick="useFreeze()">❄️ تجميد</button><button class="action-btn" id="stopOpponentBtn" onclick="useStopOpponent()" style="display:none">🚫 إيقاف الخصم</button></div>
  <div id="challengeStats" class="challenge-stats"></div>
</div>

<div id="achievementsScreen" class="screen hidden"><div class="top-bar"><button class="action-btn" onclick="backToHome()">↩ رجوع</button><span>🏆 الإنجازات</span><span class="points-display" id="achPoints">💎 0</span></div><div id="achList" class="list-container"></div></div>
<div id="bonusScreen" class="screen hidden"><div class="top-bar"><button class="action-btn" onclick="backToHome()">↩ رجوع</button><span>💰 البونص التراكمي</span><span class="points-display" id="bonusPoints">💎 0</span></div><div id="bonusList" class="list-container"></div></div>
<div id="challengesScreen" class="screen hidden"><div class="top-bar"><button class="action-btn" onclick="backToHome()">↩ رجوع</button><span>⚔️ التحديات</span><span class="points-display" id="challengePoints">💎 0</span></div><div class="tickets">تذاكر اليوم: <span id="ticketCount">5</span></div><div id="challengeList" class="list-container"></div><div class="buy-row"><button class="action-btn" onclick="buyTickets()">🎫 شراء تذكرة (200💎)</button><button class="action-btn" onclick="buyChallengeCoins()">💰 شراء 10 عملات (50💎)</button></div></div>
<div id="storeScreen" class="screen hidden"><div class="top-bar"><button class="action-btn" onclick="backToHome()">↩ رجوع</button><span>🛒 المتجر</span><span class="points-display" id="storePoints">💎 0</span></div><div id="storeItems" class="list-container"></div></div>
<div id="modal" class="modal hidden"><div class="modal-content" id="modalContent"></div></div>
<script src="script.js"></script>
</body></html>
